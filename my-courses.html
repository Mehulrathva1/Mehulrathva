<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Courses | Mehul Rathva</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">MEHUL <span>RATHVA</span></a><a class="btn outline" href="/">Home</a></div></header><main class="wrap" style="padding:55px 0"><h1>My Courses</h1><p id="msg" class="muted">Loading your purchased courses…</p><div id="myGrid" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const U='PASTE_YOUR_SUPABASE_PROJECT_URL',K='PASTE_YOUR_SUPABASE_ANON_KEY';const sb=U.startsWith('https://')&&!U.includes('PASTE_')?window.supabase.createClient(U,K):null;
(async()=>{if(!sb){document.querySelector('#msg').textContent='Configure Supabase in public/app.js and this page first.';return;}const {data:{session}}=await sb.auth.getSession();if(!session){document.querySelector('#msg').textContent='Please sign in on the home page first.';return;}const r=await fetch('/api/my-courses',{headers:{Authorization:'Bearer '+session.access_token}});const d=await r.json();if(!r.ok){document.querySelector('#msg').textContent=d.error;return;}document.querySelector('#msg').textContent=d.length?'Your purchased courses:':'You have not purchased any courses yet.';document.querySelector('#myGrid').innerHTML=d.map(c=>`<article class="card"><div class="card-art">COURSE</div><div class="card-body"><h3>${String(c.title).replace(/[&<>"]/g,'')}</h3><p>${String(c.description||'').replace(/[&<>"]/g,'')}</p><span class="tag">PURCHASED</span></div></article>`).join('');})();
</script></body></html>
